g>\n  <\u002Fdiv>\n\n  <!-- Legend -->\n  <div class=\"legend\">\n    <h4>Legend<\u002Fh4>\n    <div class=\"item\"><span class=\"swatch sw-p1\"><\u002Fspan>Phase 1<\u002Fdiv>\n    <div class=\"item\"><span class=\"swatch sw-p2\"><\u002Fspan>Phase 2<\u002Fdiv>\n    <div class=\"item\"><span class=\"swatch sw-p3\"><\u002Fspan>Phase 3<\u002Fdiv>\n    <div class=\"item\"><span class=\"swatch sw-cost\"><\u002Fspan>Cost control<\u002Fdiv>\n    <div class=\"item\"><span class=\"swatch sw-vpc\"><\u002Fspan>VPC<\u002Fdiv>\n    <div class=\"item\"><span class=\"swatch sw-pub\"><\u002Fspan>Public subnet<\u002Fdiv>\n    <div class=\"item\"><span class=\"swatch sw-priv\"><\u002Fspan>Private subnet<\u002Fdiv>\n    <div class=\"item\"><span class=\"line\"><\u002Fspan>Sync request<\u002Fdiv>\n    <div class=\"item\"><span class=\"line dashed\"><\u002Fspan>Async / event<\u002Fdiv>\n    <div class=\"item\"><span class=\"line hi\"><\u002Fspan>Highlighted journey<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <div>Stratum · Last updated <span id=\"today\">—<\u002Fspan><\u002Fdiv>\n    <div>Hover a service to see its connections · click one marked i for details · trace a flow with the chips · Controls (bottom right) filters phases and switches dark mode<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<!-- ── Tweaks panel (custom, with host protocol) ─────────────────── -->\n<div class=\"twk-panel\" id=\"twk\">\n  <div class=\"twk-hd\"><b>Controls<\u002Fb><button class=\"twk-x\" id=\"twkX\">×<\u002Fbutton><\u002Fdiv>\n  <div class=\"twk-body\">\n    <div class=\"twk-row\">\n      <div class=\"twk-sect\">View<\u002Fdiv>\n      <div class=\"twk-seg\" id=\"segPhase\">\n        <button data-v=\"both\" class=\"on\">All<\u002Fbutton>\n        <button data-v=\"phase1\">Phase 1<\u002Fbutton>\n        <button data-v=\"phase2\">Phase 2<\u002Fbutton>\n        <button data-v=\"phase3\">Phase 3<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"twk-row\">\n      <div class=\"twk-sect\">Highlight journey<\u002Fdiv>\n      <div class=\"twk-seg\" id=\"segJourney\" style=\"flex-wrap:wrap\">\n        <button data-v=\"none\" class=\"on\">None<\u002Fbutton>\n        <button data-v=\"pipeline\">Weekly pipeline<\u002Fbutton>\n        <button data-v=\"dataFetch\">Data fetch<\u002Fbutton>\n        <button data-v=\"cognitoAuth\">Cognito SSO<\u002Fbutton>\n        <button data-v=\"accessFlow\">Access request<\u002Fbutton>\n        <button data-v=\"chatFlow\">Ops Chat<\u002Fbutton>\n        <button data-v=\"changeFlow\">Change pipeline<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"twk-row\">\n      <div class=\"twk-toggle\" id=\"tglDark\">\n        <span>Dark mode<\u002Fspan><span class=\"sw\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<aside class=\"detail\" id=\"detail\" aria-live=\"polite\">\n  <button class=\"detail-x\" id=\"detailX\" type=\"button\" aria-label=\"Close\">×<\u002Fbutton>\n  <div class=\"detail-kicker\" id=\"dKick\"><\u002Fdiv>\n  <h3 id=\"dTitle\"><\u002Fh3>\n  <p id=\"dText\"><\u002Fp>\n  <ul id=\"dFacts\"><\u002Ful>\n  <div class=\"detail-sub\">Connected to<\u002Fdiv>\n  <div class=\"detail-links\" id=\"dLinks\"><\u002Fdiv>\n<\u002Faside>\n\n<button class=\"twk-open\" id=\"twkOpen\" type=\"button\">Controls<\u002Fbutton>\n\n<script>\n  // Date stamp\n  document.getElementById('today').textContent =\n    new Date().toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });\n\n  // ── Edge router ─────────────────────────────────────────────────\n  const stage = document.getElementById('stage');\n  const svg = document.getElementById('edges');\n\n  // Tag every edge with a journey-set so highlighting can pick it up.\n  const EDGES = [\n    // Phase 1 — vertical step flow; each step's target is its horizontal neighbor\n    { id:'e_sched_sfn',   from:'scheduler', to:'sfn',     style:'dashed', route:'curve', label:'weekly', out:'bottom', in:'top', sets:['pipeline'] },\n    // SFN drives every step (left side of steps column)\n    { id:'e_sfn_track',   from:'sfn',       to:'tracker', style:'solid',  route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    { id:'e_sfn_glue',    from:'sfn',       to:'glueRB',  style:'dashed', route:'curve', out:'right', in:'left', sets:['pipeline'], label:'startJobRun' },\n    // Steps chain top-to-bottom inside the Steps column (vertical stubs)\n    { id:'e_track_notif', from:'tracker',   to:'notifier',style:'dashed', route:'curve', out:'bottom', in:'top', sets:['pipeline'] },\n    { id:'e_notif_ing',   from:'notifier',  to:'ingestor',style:'dashed', route:'curve', out:'bottom', in:'top', sets:['pipeline'] },\n    { id:'e_ing_glueRB',  from:'ingestor',  to:'glueRB',  style:'solid',  route:'curve', out:'bottom', in:'top', sets:['pipeline'] },\n    { id:'e_glue1',       from:'glueRB',    to:'glueBS',  style:'solid',  route:'curve', out:'bottom', in:'top', sets:['pipeline'] },\n    { id:'e_glue2',       from:'glueBS',    to:'glueSG',  style:'solid',  route:'curve', out:'bottom', in:'top', sets:['pipeline'] },\n    // Each step → its target on the right (direct horizontal stubs)\n    { id:'e_track_ddb',   from:'tracker',   to:'ddbExec', style:'solid',  route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    { id:'e_notif_sns',   from:'notifier',  to:'snsPipe', style:'dashed', route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    { id:'e_ing_yahoo',   from:'ingestor',  to:'yahoo',   style:'solid',  route:'curve', out:'left',  in:'right', sets:['pipeline'] },\n    { id:'e_ing_raw',     from:'ingestor',  to:'s3raw',   style:'solid',  route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    { id:'e_rb_bronze',   from:'glueRB',    to:'s3bronze',style:'solid',  route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    { id:'e_bs_silver',   from:'glueBS',    to:'s3silver',style:'solid',  route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    { id:'e_sg_gold',     from:'glueSG',    to:'s3gold',  style:'solid',  route:'curve', out:'right', in:'left', sets:['pipeline'] },\n    // SNS to admin email — short curve to the right\n    { id:'e_sns_owner',   from:'snsPipe',   to:'ownerEmail', style:'dashed', route:'curve', out:'bottom', in:'top', sets:['pipeline'] },\n\n    // Phase 2 — request path\n    { id:'e_user_cf',     from:'user',      to:'cf',      style:'solid', route:'curve', out:'bottom', in:'top', sets:['dataFetch','cognitoAuth','accessFlow'] },\n    { id:'e_cf_r53',      from:'cf',        to:'route53', style:'dashed', route:'curve', label:'origin DNS', out:'bottom', in:'top', sets:[] },\n    { id:'e_cf_far',      from:'cf',        to:'fargate', style:'solid', route:'curve', out:'right', in:'left', label:'HTTPS', sets:['dataFetch','cognitoAuth','accessFlow'] },\n\n    // ECS service ↔ Gateway (sibling)\n    { id:'e_ecs_far',     from:'ecs',       to:'fargate', style:'dashed', route:'curve', out:'left', in:'right', sets:[] },\n\n    // Data fetch — gateway → data targets\n    { id:'e_far_gold',    from:'fargate',   to:'s3goldRef', style:'solid', route:'curve', out:'right', in:'left', sets:['dataFetch'] },\n    { id:'e_far_exec',    from:'fargate',   to:'ddbExecRef',style:'solid', route:'curve', out:'right', in:'left', sets:['dataFetch'] },\n    { id:'e_far_sfn',     from:'fargate',   to:'sfnRef',    style:'solid', route:'curve', out:'right', in:'left', label:'admin', sets:['dataFetch'] },\n\n    // Access request + Cognito SSO\n    { id:'e_far_ddbReq',  from:'fargate',   to:'ddbReq',    style:'solid', route:'curve', out:'right', in:'left', sets:['accessFlow'] },\n    { id:'e_far_snsAcc',  from:'fargate',   to:'snsAccess', style:'dashed', route:'curve', out:'right', in:'left', label:'request', sets:['accessFlow'] },\n    { id:'e_far_cog',     from:'fargate',   to:'cognito',   style:'solid', route:'curve', out:'right', in:'left', label:'JWKS · groups', sets:['cognitoAuth','accessFlow'] },\n    { id:'e_far_ses',     from:'fargate',   to:'ses',       style:'dashed', route:'curve', out:'right', in:'left', label:'decision', sets:['accessFlow'] },\n    { id:'e_sns_admin',   from:'snsAccess', to:'adminEmail',style:'dashed', route:'curve', out:'right', in:'left', sets:['accessFlow'] },\n    { id:'e_ses_req',     from:'ses',       to:'reqEmail',  style:'dashed', route:'curve', out:'right', in:'left', sets:['accessFlow'] },\n\n    // CI/CD\n    { id:'e_gha_ecr',     from:'gha',       to:'ecr',     style:'solid', route:'curve', out:'right', in:'left', sets:[] },\n\n    // Phase 3a — Ops Chat\n    { id:'e3_user_amp',   from:'opsUser',   to:'amplify', style:'solid', route:'curve', out:'right', in:'left', label:'Google SSO', sets:['chatFlow','changeFlow'] },\n    { id:'e3_amp_gw',     from:'amplify',   to:'gwAi',    style:'solid', route:'curve', out:'right', in:'left', label:'access token', sets:['chatFlow','changeFlow'] },\n    { id:'e3_gw_bed',     from:'gwAi',      to:'bedrock', style:'solid', route:'curve', out:'right', in:'left', label:'Converse', sets:['chatFlow'] },\n    { id:'e3_gw_dsql',    from:'gwAi',      to:'dsql',    style:'solid', route:'curve', out:'right', in:'left', sets:['chatFlow'] },\n    { id:'e3_gw_tools',   from:'gwAi',      to:'awsCw',   style:'solid', route:'curve', out:'right', in:'left', label:'read-only', sets:['chatFlow'] },\n\n    // Phase 3b — change pipeline\n    { id:'e3_req_s1',     from:'reqActor',  to:'s1',      style:'solid', route:'curve', out:'right', in:'left', label:'approved', sets:['changeFlow'] },\n    { id:'e3_s1_s2',      from:'s1',        to:'s2',      style:'solid', route:'curve', out:'bottom', in:'top', sets:['changeFlow'] },\n    { id:'e3_s2_s3',      from:'s2',        to:'s3',      style:'solid', route:'curve', out:'bottom', in:'top', sets:['changeFlow'] },\n    { id:'e3_s3_s4',      from:'s3',        to:'s4',      style:'solid', route:'curve', out:'bottom', in:'top', sets:['changeFlow'] },\n    { id:'e3_s4_s5',      from:'s4',        to:'s5',      style:'dashed', route:'curve', out:'bottom', in:'top', sets:['changeFlow'] },\n    { id:'e3_s1_ws',      from:'s1',        to:'s3ws',    style:'solid', route:'curve', out:'right', in:'left', sets:['changeFlow'] },\n    { id:'e3_s2_bed',     from:'s2',        to:'bedrockJob', style:'solid', route:'curve', out:'right', in:'left', sets:['changeFlow'] },\n    { id:'e3_s3_cb',      from:'s3',        to:'codebuild', style:'solid', route:'curve', out:'right', in:'left', label:'StartBuild', sets:['changeFlow'] },\n    { id:'e3_s4_gh',      from:'s4',        to:'ghApi',   style:'solid', route:'curve', out:'right', in:'left', label:'PR', sets:['changeFlow'] },\n    { id:'e3_s5_sns',     from:'s5',        to:'snsChange', style:'dashed', route:'curve', out:'right', in:'left', sets:['changeFlow'] },\n    { id:'e3_gh_rev',     from:'ghApi',     to:'reviewer', style:'solid', route:'curve', out:'right', in:'left', label:'review · merge', sets:['changeFlow'] },\n    { id:'e3_sns_notice', from:'snsChange', to:'noticeEmail', style:'dashed', route:'curve', out:'right', in:'left', sets:['changeFlow'] },\n\n    // Cost control band (always visible)\n    { id:'ec_eb_bc',      from:'ebCost',    to:'billingCtl', style:'dashed', route:'curve', out:'right', in:'left', label:'trigger', sets:['cost'] },\n    { id:'ec_bc_ce',      from:'billingCtl',to:'costExpl', style:'solid', route:'curve', out:'right', in:'left', label:'check', sets:['cost'] },\n    { id:'ec_bc_ecs',     from:'billingCtl',to:'ecsFleet', style:'solid', route:'curve', out:'right', in:'left', sets:['cost'] },\n    { id:'ec_bc_sns',     from:'ecsFleet',  to:'snsBill', style:'dashed', route:'curve', out:'right', in:'left', sets:['cost'] },\n  ];\n\n  const JOURNEY_NODES = {\n    pipeline: ['scheduler','sfn','tracker','notifier','ingestor','yahoo','s3raw','s3bronze','s3silver','s3gold','glueRB','glueBS','glueSG','ddbExec','snsPipe','ownerEmail'],\n    dataFetch: ['user','cf','route53','fargate','s3goldRef','ddbExecRef','sfnRef'],\n    cognitoAuth: ['user','cf','route53','fargate','cognito'],\n    accessFlow: ['user','cf','route53','fargate','ddbReq','snsAccess','cognito','ses','adminEmail','reqEmail'],\n    chatFlow: ['opsUser','amplify','gwAi','bedrock','dsql','awsCw','awsCost','awsEcs','awsSfn'],\n    changeFlow: ['opsUser','amplify','gwAi','reqActor','s1','s2','s3','s4','s5','s3ws','bedrockJob','codebuild','ghApi','snsChange','reviewer','noticeEmail'],\n  };\n\n  function rectOf(el){\n    const r = el.getBoundingClientRect();\n    const s = stage.getBoundingClientRect();\n    return { x:r.left-s.left, y:r.top-s.top, w:r.width, h:r.height,\n             cx:r.left-s.left+r.width/2, cy:r.top-s.top+r.height/2 };\n  }\n  function iconBox(el){ return el.querySelector('.ic') || el.querySelector('.av') || el; }\n  function anchorFor(el, side){\n    const r = rectOf(iconBox(el));\n    switch(side){\n      case 'top':    return { x:r.cx, y:r.y,     side };\n      case 'bottom': { const f = rectOf(el); return { x:r.cx, y:f.y+f.h, side }; }\n      case 'left':   return { x:r.x,  y:r.cy,    side };\n      case 'right':  return { x:r.x+r.w, y:r.cy, side };\n    }\n  }\n  function curvePath(a, b){\n    const dx = b.x-a.x, dy = b.y-a.y;\n    const dist = Math.hypot(dx,dy);\n    // If endpoints are on opposing sides AND nearly aligned (chained neighbor),\n    // a high-tangent bezier sags THROUGH the destination icon. Render as a\n    // short straight line instead.\n    const opposing = (a.side==='right'&&b.side==='left')||(a.side==='left'&&b.side==='right')\n                  || (a.side==='top'&&b.side==='bottom')||(a.side==='bottom'&&b.side==='top');\n    const horiz = (a.side==='left'||a.side==='right');\n    if(opposing){\n      const aligned = horiz ? Math.abs(a.y-b.y) < 12 : Math.abs(a.x-b.x) < 12;\n      if(aligned) return `M${a.x},${a.y} L${b.x},${b.y}`;\n    }\n    const k = Math.min(80, Math.max(28, dist*0.32));\n    const tan = (p)=>{\n      switch(p.side){\n        case 'top':    return [0,-k];\n        case 'bottom': return [0, k];\n        case 'left':   return [-k,0];\n        case 'right':  return [ k,0];\n      }\n      return [0,0];\n    };\n    const [tax,tay] = tan(a), [tbx,tby] = tan(b);\n    return `M${a.x},${a.y} C${a.x+tax},${a.y+tay} ${b.x+tbx},${b.y+tby} ${b.x},${b.y}`;\n  }\n  function roundedPolyline(pts, r){\n    if(pts.length<2) return '';\n    let d = `M${pts[0][0]},${pts[0][1]}`;\n    for(let i=1;i<pts.length-1;i++){\n      const [px,py] = pts[i-1], [cx,cy] = pts[i], [nx,ny] = pts[i+1];\n      const v1 = [Math.sign(cx-px), Math.sign(cy-py)];\n      const v2 = [Math.sign(nx-cx), Math.sign(ny-cy)];\n      const r1 = Math.min(r, Math.hypot(cx-px,cy-py)/2, Math.hypot(nx-cx,ny-cy)/2);\n      const a = [cx - v1[0]*r1, cy - v1[1]*r1];\n      const c = [cx + v2[0]*r1, cy + v2[1]*r1];\n      d += ` L${a[0]},${a[1]} Q${cx},${cy} ${c[0]},${c[1]}`;\n    }\n    const last = pts[pts.length-1];\n    d += ` L${last[0]},${last[1]}`;\n    return d;\n  }\n  function orthoPath(a, b, railOffset){\n    const out = a.side, inn = b.side;\n    const r = 8;\n    let pts;\n    if(out === inn && (out === 'top' || out === 'bottom')){\n      const dir = (out === 'top') ? -1 : 1;\n      const off = (railOffset != null) ? railOffset : dir * 36;\n      const baseY = (out === 'top') ? Math.min(a.y, b.y) : Math.max(a.y, b.y);\n      const ry = baseY + off;\n      pts = [[a.x,a.y],[a.x,ry],[b.x,ry],[b.x,b.y]];\n    } else if(out === inn && (out === 'left' || out === 'right')){\n      const dir = (out === 'left') ? -1 : 1;\n      const off = (railOffset != null) ? railOffset : dir * 36;\n      const baseX = (out === 'left') ? Math.min(a.x, b.x) : Math.max(a.x, b.x);\n      const rx = baseX + off;\n      pts = [[a.x,a.y],[rx,a.y],[rx,b.y],[b.x,b.y]];\n    } else if((out==='bottom'||out==='top') && (inn==='top'||inn==='bottom')){\n      const railY = (out==='bottom' && inn==='top') ? b.y - 16\n                  : (out==='top' && inn==='bottom') ? b.y + 16\n                  : (a.y + b.y)/2;\n      pts = [[a.x,a.y],[a.x,railY],[b.x,railY],[b.x,b.y]];\n    } else if((out==='left'||out==='right') && (inn==='left'||inn==='right')){\n      const railX = (out==='right' && inn==='left') ? b.x - 16\n                  : (out==='left' && inn==='right') ? b.x + 16\n                  : (a.x + b.x)/2;\n      pts = [[a.x,a.y],[railX,a.y],[railX,b.y],[b.x,b.y]];\n    } else if((out==='bottom'||out==='top') && (inn==='left'||inn==='right')){\n      // L-shape: leave vertically, then horizontal into side\n      pts = [[a.x,a.y],[a.x,b.y],[b.x,b.y]];\n    } else if((out==='left'||out==='right') && (inn==='top'||inn==='bottom')){\n      // L-shape: leave horizontally, then vertical into top/bottom\n      pts = [[a.x,a.y],[b.x,a.y],[b.x,b.y]];\n    } else {\n      pts = [[a.x,a.y],[b.x,b.y]];\n    }\n    return roundedPolyline(pts, r);\n  }\n\n  // Stagger anchors when many edges share the same bottom/top anchor\n  function staggerAnchors(){\n    const counts = {};\n    EDGES.forEach(e=>{\n      if(!e.out) return;\n      const k = `${e.from}|${e.out}`;\n      counts[k] = (counts[k]||0) + 1;\n    });\n    const seen = {};\n    EDGES.forEach(e=>{\n      if(!e.out) return;\n      const k = `${e.from}|${e.out}`;\n      if(counts[k] < 2) return;\n      seen[k] = (seen[k]||0);\n      e._stagger = seen[k] - (counts[k]-1)/2;\n      seen[k]++;\n    });\n  }\n  staggerAnchors();\n\n  function anchorWithStagger(el, side, stagger){\n    const r = rectOf(iconBox(el));\n    const off = (stagger||0) * 8;\n    switch(side){\n      case 'top':    return { x:r.cx + off, y:r.y,     side };\n      case 'bottom': { const f = rectOf(el); return { x:r.cx + off, y:f.y+f.h, side }; }\n      case 'left':   return { x:r.x,  y:r.cy + off,    side };\n      case 'right':  return { x:r.x+r.w, y:r.cy + off, side };\n    }\n  }\n  function midOfPath(pathEl){\n    try { const len = pathEl.getTotalLength(); return pathEl.getPointAtLength(len/2); }\n    catch(e){ return {x:0,y:0}; }\n  }\n\n  let pathById = {};\n  function layout(){\n    Array.from(svg.querySelectorAll('path,text')).forEach(n=>n.remove());\n    pathById = {};\n    const s = stage.getBoundingClientRect();\n    svg.setAttribute('viewBox', `0 0 ${s.width} ${s.height}`);\n    svg.setAttribute('width',  s.width);\n    svg.setAttribute('height', s.height);\n\n    EDGES.forEach(e=>{\n      const a = stage.querySelector(`[data-id=\"${e.from}\"]`);\n      const b = stage.querySelector(`[data-id=\"${e.to}\"]`);\n      if(!a || !b) return;\n      // Skip edges where endpoint is hidden (phase filter)\n      if(a.offsetParent === null || b.offsetParent === null) return;\n\n      let d;\n      const sA = e.out, sB = e.in;\n      const pa = anchorWithStagger(a, sA||'right', e._stagger);\n      const pb = anchorFor(b, sB||'left');\n      if(e.route === 'ortho' && sA && sB){\n        d = orthoPath(pa, pb, e.railOffset);\n      } else {\n        d = curvePath(pa, pb);\n      }\n      const dim = (e.style==='dashed');\n      const p = document.createElementNS('http://www.w3.org/2000/svg','path');\n      p.setAttribute('d', d);\n      p.setAttribute('class', dim ? 'dim dashed' : '');\n      p.setAttribute('marker-end', dim ? 'url(#arrow-dim)' : 'url(#arrow)');\n      p.setAttribute('data-edge', e.id);\n      p.setAttribute('data-sets', (e.sets||[]).join(','));\n      p.setAttribute('data-style', e.style);\n      svg.appendChild(p);\n      pathById[e.id] = p;\n\n      if(e.label){\n        const m = midOfPath(p);\n        const bg = document.createElementNS('http://www.w3.org/2000/svg','text');\n        bg.setAttribute('x', m.x); bg.setAttribute('y', m.y);\n        bg.setAttribute('text-anchor','middle'); bg.setAttribute('dy','.32em');\n        bg.setAttribute('class','lbl-bg'); bg.setAttribute('data-edge', e.id);\n        bg.textContent = e.label;\n        svg.appendChild(bg);\n        const t = document.createElementNS('http://www.w3.org/2000/svg','text');\n        t.setAttribute('x', m.x); t.setAttribute('y', m.y);\n        t.setAttribute('text-anchor','middle'); t.setAttribute('dy','.32em');\n        t.setAttribute('data-edge', e.id);\n        t.textContent = e.label;\n        svg.appendChild(t);\n      }\n    });\n\n    applyJourney();\n  }\n\n  // ── Tweaks state ──────────────────────────────────────────────\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"view\": \"both\",\n    \"journey\": \"none\",\n    \"dark\": false\n  }/*EDITMODE-END*/;\n  const state = {...TWEAKS};\n\n  function applyView(){\n    stage.setAttribute('data-show', state.view);\n    requestAnimationFrame(layout);\n  }\n  // Edges that stay visible in \"calm view\" (state.journey === 'none')\n  // for Phase 2: just the request path + sibling links + cross-cutting.\n  const CALM_EDGES = new Set([\n    // Phase 2: just the request path + sibling link\n    'e_user_cf','e_cf_r53','e_cf_far','e_ecs_far',\n    // Phase 1: keep all edges visible (it reads as a single linear pipeline)\n    'e_sched_sfn','e_sfn_track','e_sfn_glue','e_track_notif','e_notif_ing','e_ing_glueRB',\n    'e_glue1','e_glue2','e_track_ddb','e_notif_sns','e_ing_yahoo','e_ing_raw',\n    'e_rb_bronze','e_bs_silver','e_sg_gold','e_sns_owner',\n    // CI/CD always visible\n    'e_gha_ecr',\n    // Phase 3: chat path and the whole change pipeline stay visible\n    'e3_user_amp','e3_amp_gw','e3_gw_bed','e3_gw_dsql','e3_gw_tools',\n    'e3_req_s1','e3_s1_s2','e3_s2_s3','e3_s3_s4','e3_s4_s5','e3_s1_ws','e3_s2_bed','e3_s3_cb','e3_s4_gh','e3_s5_sns','e3_gh_rev','e3_sns_notice',\n    // Cost control band always visible\n    'ec_eb_bc','ec_bc_ce','ec_bc_ecs','ec_bc_sns'\n  ]);\n\n  function applyJourney(){\n    const j = state.journey;\n    const nodes = stage.querySelectorAll('.node, .actor');\n    // Sync inline chips\n    document.querySelectorAll('.flow-chips .chip').forEach(b=>{\n      b.classList.toggle('is-active', b.dataset.flow === j);\n    });\n\n    if(j === 'all'){\n      // Show every edge, no highlight\n      stage.classList.remove('highlight');\n      nodes.forEach(n=>n.classList.remove('is-hi'));\n      svg.querySelectorAll('[data-edge]').forEach(p=>{\n        p.classList.remove('hi-edge','dim-out','calm-hide');\n        if(p.tagName.toLowerCase()==='path'){\n          const dim = p.getAttribute('data-style')==='dashed';\n          p.setAttribute('marker-end', dim ? 'url(#arrow-dim)' : 'url(#arrow)');\n        }\n      });\n      return;\n    }\n\n    if(j === 'none' || !j){\n      // Calm view: hide non-essential Phase 2 edges, no highlight\n      stage.classList.remove('highlight');\n      nodes.forEach(n=>n.classList.remove('is-hi'));\n      svg.querySelectorAll('[data-edge]').forEach(p=>{\n        const id = p.getAttribute('data-edge');\n        const calm = CALM_EDGES.has(id);\n        p.classList.remove('hi-edge','dim-out');\n        p.classList.toggle('calm-hide', !calm);\n        if(p.tagName.toLowerCase()==='path'){\n          const dim = p.getAttribute('data-style')==='dashed';\n          p.setAttribute('marker-end', dim ? 'url(#arrow-dim)' : 'url(#arrow)');\n        }\n      });\n      return;\n    }\n\n    // Specific journey: show calm edges + that flow's edges, highlight flow\n    stage.classList.add('highlight');\n    const set = new Set(JOURNEY_NODES[j]||[]);\n    nodes.forEach(n=>{\n      const id = n.getAttribute('data-id');\n      n.classList.toggle('is-hi', set.has(id));\n    });\n    svg.querySelectorAll('[data-edge]').forEach(p=>{\n      const id = p.getAttribute('data-edge');\n      // Look up sets from the path (text elements don't carry data-sets)\n      const pathEl = p.tagName.toLowerCase()==='path' ? p : svg.querySelector(`path[data-edge=\"${id}\"]`);\n      const setsAttr = pathEl ? (pathEl.getAttribute('data-sets')||'') : '';\n      const sets = setsAttr.split(',');\n      const on = sets.includes(j);\n      const calm = CALM_EDGES.has(id);\n      p.classList.toggle('hi-edge', on);\n      p.classList.toggle('dim-out', !on && calm);\n      p.classList.toggle('calm-hide', !on && !calm);\n      if(p.tagName.toLowerCase()==='path'){\n        p.setAttribute('marker-end', on ? 'url(#arrow-hi)' : (p.getAttribute('data-style')==='dashed' ? 'url(#arrow-dim)' : 'url(#arrow)'));\n      }\n    });\n  }\n  function applyDark(){\n    document.documentElement.classList.toggle('dark', !!state.dark);\n    requestAnimationFrame(layout);\n  }\n  function persist(patch){\n    Object.assign(state, patch);\n    try{ window.parent.postMessage({type:'__edit_mode_set_keys', edits: patch}, '*'); }catch(e){}\n  }\n\n  // Tweaks panel wiring\n  const twk = document.getElementById('twk');\n  document.getElementById('twkX').onclick = ()=>{\n    twk.classList.remove('open');\n    try{ window.parent.postMessage({type:'__edit_mode_dismissed'}, '*'); }catch(e){}\n  };\n  function bindSeg(elId, key, after){\n    const el = document.getElementById(elId);\n    el.addEventListener('click', (e)=>{\n      const b = e.target.closest('button'); if(!b) return;\n      el.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));\n      persist({[key]: b.dataset.v}); after();\n    });\n    // init\n    el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v === state[key]));\n  }\n  bindSeg('segPhase','view', applyView);\n  bindSeg('segJourney','journey', applyJourney);\n\n  // Inline flow-trace chips (Phase 2 + Phase 3 headers) — drive shared journey state\n  ['flowChips','flowChips3'].forEach(function(cid){\n    const strip = document.getElementById(cid);\n    if(!strip) return;\n    strip.addEventListener('click', (e)=>{\n      const b = e.target.closest('.chip'); if(!b) return;\n      const v = b.dataset.flow;\n      const next = (b.classList.contains('is-active') && v !== 'none') ? 'none' : v;\n      persist({ journey: next });\n      const seg = document.getElementById('segJourney');\n      if(seg){ seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.v === next)); }\n      applyJourney();\n    });\n  });\n  const tglDark = document.getElementById('tglDark');\n  function syncDark(){ tglDark.classList.toggle('on', !!state.dark); }\n  tglDark.addEventListener('click', ()=>{ persist({dark: !state.dark}); syncDark(); applyDark(); });\n  syncDark();\n\n  document.getElementById('twkOpen').addEventListener('click', ()=>twk.classList.add('open'));\n\n  // Hover or click a service: connections light up; click opens the details drawer (sample set)\n  const DETAILS = {\n    gateway: { kicker:'Phase 2 · Compute', title:'Gateway API',\n      text:'One FastAPI service serves the data API, ops actions, access management and the AI routes.',\n      facts:['ECS Fargate Spot in a public subnet: no ALB, no NAT Gateway','CloudFront reaches it through a Route 53 A record that a Lambda re-points whenever Spot replaces the task','One dependency verifies the Cognito access token; roles are declared per router and deny by default','OpenAPI is generated from the code and rendered with Swagger UI'] },\n    bedrock: { kicker:'AI layer · Model', title:'Amazon Bedrock',\n      text:'Claude Sonnet 4.6 behind one client used by Ops Chat and the change pipeline.',\n      facts:['Every call is recorded: tokens in and out, cache tokens, latency and cost','Prompt caching is on for the system prompt and tools','Ops Chat is capped by a per-user and a global daily spend limit; pipeline calls are recorded per step and attempt'] },\n    dsql: { kicker:'AI layer · Data', title:'Aurora DSQL',\n      text:'Serverless SQL for the data nobody can predict the questions for: audit, spend, chat and jobs.',\n      facts:['Idle cost is zero and it sits inside the free tier: the one approved exception to no RDS','Holds the call audit, daily spend counters, chat sessions, jobs, steps and events','Schema changes are versioned migrations applied when the gateway boots'] },\n    cognito: { kicker:'Phase 2 · Identity', title:'Amazon Cognito',\n      text:'Google sign-in for people only; no machine credentials anywhere.',\n      facts:['Every request carries an access token, never an ID token','Two platform roles: stratum-user and stratum-admin','A user with no role still gets a token, but every non-public route answers 403'] },\n    codebuild: { kicker:'Change pipeline · Step 3', title:'CodeBuild sandbox',\n      text:'Runs the repository own checks against the generated change before any pull request exists.',\n      facts:['Overlays the generated files on the exact base snapshot read from S3','Python repos: ruff, mypy, pytest. UI repo: lint, tsc, build','On failure the model gets the failing logs and fixes the files, up to three rounds','Its role can reach only the workspace bucket prefixes, and it holds no secrets'] },\n    workspace: { kicker:'Change pipeline · Storage', title:'S3 workspace',\n      text:'Everything a job reads or produces, in separate prefixes with their own retention.',\n      facts:['Repo snapshots keyed by commit SHA, so a job always builds on its exact base','Generated files for the job, and the sandbox results kept as evidence','Lifecycle rules per prefix remove old snapshots, workspaces and results'] },\n    billing: { kicker:'Cost control', title:'billing-control',\n      text:'One Step Functions router whose input decides what happens.',\n      facts:['Scheduled STOP and START shut ECS down nightly and at weekends','No payload runs the daily Cost Explorer check; on a breach it alerts, disables every schedule except its own and drains ECS to zero','RESTORE is a single manual execution'] },\n\n    eventbridge: { kicker:'Phase 1 · Trigger', title:'EventBridge schedule',\n      text:'A weekly cron starts the data pipeline; no one has to remember to run it.',\n      facts:['One rule starts the pipeline state machine','Schedules and their on/off switches are Terraform variables per environment'] },\n    pipelineSfn: { kicker:'Phase 1 · Orchestration', title:'Step Functions pipeline',\n      text:'The state machine runs the whole weekly pipeline and always ends by recording the result.',\n      facts:['Tracker and notifier run first, then ingestion, then three Glue jobs one after another','Glue jobs use the .sync integration, so a step waits for its job to finish','A failure at any stage goes to a tracker and a notifier that record and announce it'] },\n    yahoo: { kicker:'Phase 1 · Source', title:'Yahoo Finance',\n      text:'Public market data for US tech, Indian NSE equities, crypto, indices and commodities.',\n      facts:['Read by direct HTTP calls to the chart API with a browser User-Agent','The yfinance library was dropped because cloud IPs are blocked'] },\n    tracker: { kicker:'Phase 1 · Lambda', title:'pipeline-tracker',\n      text:'Writes the run record that the API and Ops Chat read later.',\n      facts:['Called at the start and again at the end of every run','Stores status, timings and per-symbol counts in DynamoDB'] },\n    notifier: { kicker:'Phase 1 · Lambda', title:'pipeline-notifier',\n      text:'Turns a run into an email at the start and at the end.',\n      facts:['Publishes start, success and failure messages to SNS','A failed notification never blocks the run'] },\n    ingestor: { kicker:'Phase 1 · Lambda', title:'data-ingestor',\n      text:'Fetches the symbols and lands them untouched in the raw bucket.',\n      facts:['One JSON file per symbol under a date-partitioned prefix','Returns the ingested date that the Glue jobs receive as an argument'] },\n    glueRaw: { kicker:'Phase 1 · Glue', title:'raw to bronze',\n      text:'First ETL stage: make the raw files trustworthy.',\n      facts:['Schema enforcement and de-duplication','Writes Parquet; dynamic partition overwrite keeps reruns safe'] },\n    glueSilver: { kicker:'Phase 1 · Glue', title:'bronze to silver',\n      text:'Business transforms and enrichment.',\n      facts:['Reads the whole bronze table, not just the latest partition, so rolling metrics are correct','Adds 7 and 30 day moving averages and 52 week highs and lows'] },\n    glueGold: { kicker:'Phase 1 · Glue', title:'silver to gold',\n      text:'Aggregations and KPIs that the API serves.',\n      facts:['Weekly summary, top and worst performers, volatility report, asset-class summary and per-symbol detail','Gold is the serving layer: nothing sits between it and the API'] },\n    ddbExecution: { kicker:'Data · DynamoDB', title:'pipeline-executions',\n      text:'One record per pipeline run.',\n      facts:['Written by the tracker Lambda','Read by the gateway and by an Ops Chat tool','Kept on DynamoDB because the Lambdas already write it'] },\n    snsPipeline: { kicker:'Phase 1 · Notifications', title:'pipeline-notifications',\n      text:'SNS topic for the pipeline start, success and failure messages.',\n      facts:['The owner email is subscribed','Subjects stay ASCII and short so every mail client shows them'] },\n    ownerEmail: { kicker:'Phase 1 · People', title:'Owner email',\n      text:'The person who gets the pipeline alerts.',\n      facts:['Start notice, then a success summary with per-symbol counts and duration','A failure notice if any stage fails'] },\n    s3Raw: { kicker:'Medallion · Layer 1', title:'S3 raw',\n      text:'Untouched source files.',\n      facts:['One JSON file per symbol per run','Date-partitioned prefix so a rerun never overwrites another day'] },\n    s3Bronze: { kicker:'Medallion · Layer 2', title:'S3 bronze',\n      text:'Typed, de-duplicated Parquet.',\n      facts:['Schema is enforced here, not downstream'] },\n    s3Silver: { kicker:'Medallion · Layer 3', title:'S3 silver',\n      text:'Enriched Parquet with the business metrics.',\n      facts:['Moving averages and highs and lows live here'] },\n    s3Gold: { kicker:'Medallion · Layer 4', title:'S3 gold',\n      text:'The serving layer.',\n      facts:['The gateway resolves the latest ingested_date partition at query time','There is no database between the pipeline and the data API'] },\n\n    endUser: { kicker:'Phase 2 · People', title:'End user',\n      text:'Anyone with an approved Google account.',\n      facts:['Signs in through the Cognito hosted UI','Reaches the API through Swagger UI or the ops UI'] },\n    cloudfront: { kicker:'Phase 2 · Edge', title:'CloudFront',\n      text:'The only public entry point to the gateway.',\n      facts:['Terminates TLS and forwards the Authorization header, which the whole auth model depends on','Its origin is the Route 53 record that follows the current task'] },\n    route53: { kicker:'Phase 2 · DNS', title:'Route 53',\n      text:'Replaces the load balancer.',\n      facts:['An origin A record holds the current task public IP','An EventBridge rule on ECS task state changes triggers a Lambda that updates it when Spot replaces the task','The Lambda retries because the IP appears slightly after the task reports RUNNING'] },\n    ecsService: { kicker:'Phase 2 · Compute', title:'ECS service',\n      text:'Keeps one gateway task running.',\n      facts:['Desired count is runtime state set by the scheduler, so Terraform ignores it','Images are tagged with the git SHA and cannot be overwritten'] },\n    s3GoldRef: { kicker:'Phase 2 · Data fetch', title:'Gold bucket read',\n      text:'The data endpoints read gold Parquet straight from S3.',\n      facts:['Latest partition resolved per request','Read-only access through the task role'] },\n    ddbExecRef: { kicker:'Phase 2 · Data fetch', title:'Execution records',\n      text:'Pipeline run history for the API and Ops Chat.',\n      facts:['Same table the tracker Lambda writes','Newest runs first, with a limit'] },\n    sfnRef: { kicker:'Phase 2 · Ops action', title:'On-demand pipeline run',\n      text:'Admins can start the ETL pipeline without waiting for the schedule.',\n      facts:['Explicit admin-only endpoint that answers 202 with the execution','Ops Chat never calls it; it only reads'] },\n    ddbAccess: { kicker:'Phase 2 · Access', title:'access-requests table',\n      text:'Every access request and its decision.',\n      facts:['A second request from the same email while one is pending returns the pending one','Approval and rejection are single transactions, so two admins cannot both decide'] },\n    snsAccess: { kicker:'Phase 2 · Access', title:'access-requests topic',\n      text:'Tells the admin that someone is waiting.',\n      facts:['Published when a request is created','Approving or rejecting happens in the ops UI'] },\n    ses: { kicker:'Phase 2 · Email', title:'Amazon SES',\n      text:'Sends the decision email to the requester.',\n      facts:['Sent after the decision is recorded; a failed send is logged and never fails the approval','DKIM, SPF and DMARC are set up on the sending domain'] },\n    adminPerson: { kicker:'Phase 2 · People', title:'Admin',\n      text:'Decides who gets in.',\n      facts:['Approves or rejects in the ops UI','Approval adds the user to a Cognito role group'] },\n    requester: { kicker:'Phase 2 · People', title:'Requester',\n      text:'Gets an email either way.',\n      facts:['Approval email links to the ops UI and the API docs','Rejection email names a support address'] },\n\n    opsUser: { kicker:'Phase 3 · People', title:'Ops user',\n      text:'A signed-in user of the ops UI.',\n      facts:['stratum-user: chat, status, own jobs','stratum-admin: also approvals, admin usage and ops actions'] },\n    amplify: { kicker:'Phase 3 · Front end', title:'Ops UI on Amplify',\n      text:'Next.js 16 server-rendered on AWS Amplify.',\n      facts:['Signs in with Google through Cognito and forwards the user token to the gateway','Tokens never reach the browser: every call goes through server-side proxy routes','Chat answers are polled because Amplify buffers streamed responses'] },\n    toolLogs: { kicker:'Ops Chat · Tool', title:'CloudWatch tools',\n      text:'Log search and error summaries for the platform functions.',\n      facts:['Read-only','Summaries are built in the gateway, so no Logs Insights permission is needed'] },\n    toolCost: { kicker:'Ops Chat · Tool', title:'Cost Explorer tools',\n      text:'Month-to-date spend and per-service breakdown.',\n      facts:['Cached for an hour because each call costs money','Never returns an account ID'] },\n    toolEcs: { kicker:'Ops Chat · Tool', title:'ECS and Lambda tools',\n      text:'Service, task and function status.',\n      facts:['Names are checked against the project prefix, never taken from the model'] },\n    toolSfn: { kicker:'Ops Chat · Tool', title:'Step Functions tools',\n      text:'Pipeline executions, step detail and Glue job runs.',\n      facts:['Read-only by name; anything that changes infrastructure is an explicit admin endpoint'] },\n    requestApprove: { kicker:'Change pipeline · Gate 1', title:'Request and approve',\n      text:'A person describes the change; an admin decides.',\n      facts:['Repo, title, description and acceptance criteria, saved as a draft or submitted','The repo must be on an allowlist','Nothing runs until an admin approves'] },\n    step1: { kicker:'Change pipeline · Step 1', title:'code_context_sync',\n      text:'Takes a snapshot of the target repo.',\n      facts:['Downloads the tarball over HTTPS, no git binary involved','One S3 object per file, keyed by commit SHA; the manifest is written last so a crashed sync never looks complete','Skips build folders and links, and caps file and total size'] },\n    step2: { kicker:'Change pipeline · Step 2', title:'generate_artifacts',\n      text:'Two model calls with different jobs.',\n      facts:['The planner sees file paths only and picks what to touch','The author sees only those files and returns exact find-and-replace edits that code applies','A path guard and an output guard check everything written; repo text reaches the model only as marked data'] },\n    step3: { kicker:'Change pipeline · Step 3', title:'sandbox_build',\n      text:'Starts the CodeBuild project and waits for the verdict.',\n      facts:['Resumes by build ID, so a restart does not start a second build','Each attempt keeps its own evidence','After three failed fix rounds the pipeline still raises the PR, flagged for manual fix'] },\n    step4: { kicker:'Change pipeline · Step 4', title:'create_pr',\n      text:'Turns the workspace into a pull request.',\n      facts:['One atomic commit on a change/ branch through the Git Data API','Reuses the open PR on a re-run; a failed validation makes it a draft with a manual-fix banner','The description carries the build evidence'] },\n    step5: { kicker:'Change pipeline · Step 5', title:'notify',\n      text:'Announces the outcome.',\n      facts:['SNS notice on completion and on the failure of any other step','Best effort: it can never fail the job'] },\n    github: { kicker:'Change pipeline · Source control', title:'GitHub',\n      text:'Where the repo is read and the pull request is raised.',\n      facts:['The pipeline only writes change/ branches and never merges','The token is read from SSM at run time and cached briefly'] },\n    snsChange: { kicker:'Change pipeline · Notifications', title:'change-pipeline topic',\n      text:'SNS topic for job completion and failure notices.',\n      facts:['The gateway builds the topic ARN at run time, so no account ID is stored'] },\n    reviewer: { kicker:'Change pipeline · Gate 2', title:'Human review',\n      text:'The last word is always a person.',\n      facts:['Reviews the PR and the build evidence, then merges or closes it','Nothing the pipeline generates reaches a protected branch on its own'] },\n    noticeEmail: { kicker:'Change pipeline · People', title:'Notice email',\n      text:'Done or failed, in the inbox.',\n      facts:['Sent for every finished job and for a failed step'] },\n\n    ebCost: { kicker:'Cost control · Trigger', title:'EventBridge schedules',\n      text:'Three cron rules drive the cost state machine.',\n      facts:['Evening stop and weekday-morning start of the ECS services','A daily rule with no payload runs the billing check'] },\n    costExplorer: { kicker:'Cost control · Check', title:'Cost Explorer check',\n      text:'Compares month-to-date spend with a threshold.',\n      facts:['Run once a day by the billing-guard Lambda','Cost Explorer is a us-east-1 service whatever region the Lambda runs in'] },\n    ecsFleet: { kicker:'Cost control · Action', title:'ECS fleet',\n      text:'What actually gets shut down.',\n      facts:['Normal nights and weekends: desired count 0, back to 1 on weekday mornings','On a breach every ECS service is drained to zero'] },\n    snsBilling: { kicker:'Cost control · Alerts', title:'Billing alerts',\n      text:'An email when the circuit breaker trips or is restored.',\n      facts:['A failed notification never aborts the shutdown or the restore'] },\n    llmCap: { kicker:'Cost control · AI', title:'AI spend limits',\n      text:'The same cost-first rule applied to model calls.',\n      facts:['A per-user and a global daily limit on Ops Chat, in dollars','Checked before every turn; over the limit answers 429 with the reset time','Admins can change the limits and see everyone usage'] },\n\n    iam: { kicker:'Security', title:'IAM',\n      text:'Least privilege, centralised.',\n      facts:['Policies live in one dedicated Terraform module','The sandbox role can reach only its bucket prefixes','The gateway task role is separate from the Lambda roles'] },\n    ssm: { kicker:'Configuration', title:'Parameter Store',\n      text:'Nothing is hardcoded.',\n      facts:['Bucket names carry random suffixes and are published here','CI and task definitions resolve them at deploy time'] },\n    cloudwatch: { kicker:'Observability', title:'CloudWatch',\n      text:'Logs for every function and service.',\n      facts:['Container Insights is off in DEV to save cost','Ops Chat can search and summarise these logs'] },\n    githubActions: { kicker:'Build and deploy', title:'GitHub Actions',\n      text:'Separate pipelines for application code and infrastructure.',\n      facts:['Branch maps to environment: develop to DEV, release to UAT, master to PROD','Type checks and tests gate the gateway deploy'] },\n    ecr: { kicker:'Build and deploy', title:'ECR',\n      text:'Container images for the gateway.',\n      facts:['Immutable tags, one per git SHA, so every deploy is traceable','Scan on push'] },\n    terraform: { kicker:'Build and deploy', title:'Terraform',\n      text:'All infrastructure as code through HCP Terraform.',\n      facts:['Layered modules with cross-module references through remote state and a defined apply order','One workspace per module directory'] }\n  };\n  const DETAIL_IDS = {\n    fargate:'gateway', gwAi:'gateway', bedrock:'bedrock', bedrockJob:'bedrock', dsql:'dsql', cognito:'cognito',\n    codebuild:'codebuild', s3ws:'workspace', billingCtl:'billing',\n    scheduler:'eventbridge', sfn:'pipelineSfn', yahoo:'yahoo', tracker:'tracker', notifier:'notifier', ingestor:'ingestor',\n    glueRB:'glueRaw', glueBS:'glueSilver', glueSG:'glueGold', ddbExec:'ddbExecution', snsPipe:'snsPipeline',\n    ownerEmail:'ownerEmail', s3raw:'s3Raw', s3bronze:'s3Bronze', s3silver:'s3Silver', s3gold:'s3Gold',\n    user:'endUser', cf:'cloudfront', route53:'route53', ecs:'ecsService', s3goldRef:'s3GoldRef', ddbExecRef:'ddbExecRef',\n    sfnRef:'sfnRef', ddbReq:'ddbAccess', snsAccess:'snsAccess', ses:'ses', adminEmail:'adminPerson', reqEmail:'requester',\n    opsUser:'opsUser', amplify:'amplify', awsCw:'toolLogs', awsCost:'toolCost', awsEcs:'toolEcs', awsSfn:'toolSfn',\n    reqActor:'requestApprove', s1:'step1', s2:'step2', s3:'step3', s4:'step4', s5:'step5', ghApi:'github',\n    snsChange:'snsChange', reviewer:'reviewer', noticeEmail:'noticeEmail',\n    ebCost:'ebCost', costExpl:'costExplorer', ecsFleet:'ecsFleet', snsBill:'snsBilling', llmCap:'llmCap',\n    iam:'iam', ssm:'ssm', cw:'cloudwatch', gha:'githubActions', ecr:'ecr', tf:'terraform'\n  };\n  Object.keys(DETAIL_IDS).forEach(id=>{\n    const el = stage.querySelector('[data-id=\"' + id + '\"]');\n    if(el) el.classList.add('has-detail');\n  });\n\n  let selectedId = null;\n  function nameOf(id){\n    const el = stage.querySelector('[data-id=\"' + id + '\"] .lbl');\n    return el ? el.textContent.trim() : id;\n  }\n  function focusEdges(id){\n    const linked = new Set();\n    EDGES.forEach(ed=>{ if(ed.from===id || ed.to===id) linked.add(ed.id); });\n    svg.querySelectorAll('.hover-on,.hover-off').forEach(n=>n.classList.remove('hover-on','hover-off'));\n    if(!id || !linked.size) return;\n    svg.querySelectorAll('[data-edge]').forEach(el=>{\n      const on = linked.has(el.getAttribute('data-edge'));\n      el.classList.toggle('hover-on', on && el.tagName.toLowerCase()==='path');\n      el.classList.toggle('hover-off', !on);\n    });\n  }\n  function closeDetail(){\n    document.getElementById('detail').classList.remove('open');\n    stage.querySelectorAll('.is-selected').forEach(n=>n.classList.remove('is-selected'));\n    selectedId = null; focusEdges(null);\n  }\n  function openDetail(id){\n    const d = DETAILS[DETAIL_IDS[id]]; if(!d) return;\n    stage.querySelectorAll('.is-selected').forEach(n=>n.classList.remove('is-selected'));\n    stage.querySelector('[data-id=\"' + id + '\"]').classList.add('is-selected');\n    selectedId = id; focusEdges(id);\n    document.getElementById('dKick').textContent = d.kicker;\n    document.getElementById('dTitle').textContent = d.title;\n    document.getElementById('dText').textContent = d.text;\n    const ul = document.getElementById('dFacts'); ul.innerHTML = '';\n    d.facts.forEach(f=>{ const li = document.createElement('li'); li.textContent = f; ul.appendChild(li); });\n    const links = document.getElementById('dLinks'); links.innerHTML = '';\n    const seen = new Set();\n    EDGES.forEach(ed=>{\n      let dir = null, other = null;\n      if(ed.from===id){ dir = '→'; other = ed.to; } else if(ed.to===id){ dir = '←'; other = ed.from; }\n      if(!dir || seen.has(dir + other)) return;\n      seen.add(dir + other);\n      const row = document.createElement('div');\n      const a = document.createElement('b'); a.textContent = dir;\n      const s = document.createElement('span'); s.textContent = nameOf(other) + (ed.label ? ' (' + ed.label + ')' : '');\n      row.appendChild(a); row.appendChild(s); links.appendChild(row);\n    });\n    const pop = document.getElementById('detail');\n    pop.classList.add('open');\n    const nodeEl = stage.querySelector('[data-id=\"' + id + '\"]');\n    const r = nodeEl.getBoundingClientRect();\n    const ic = nodeEl.querySelector('.ic, .av').getBoundingClientRect();\n    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 12, edge = 12;\n    let left = r.right + gap;\n    if(left + w > window.innerWidth - edge) left = r.left - gap - w;\n    left = Math.max(edge, Math.min(left, window.innerWidth - w - edge));\n    let top = ic.top - 10;\n    top = Math.max(edge, Math.min(top, window.innerHeight - h - edge));\n    pop.style.left = (left + window.scrollX) + 'px';\n    pop.style.top = (top + window.scrollY) + 'px';\n  }\n  stage.addEventListener('mouseover', (e)=>{\n    const n = e.target.closest('.node, .actor'); if(!n || !n.dataset.id) return;\n    focusEdges(n.dataset.id);\n  });\n  stage.addEventListener('mouseout', (e)=>{ if(e.target.closest('.node, .actor')) focusEdges(selectedId); });\n  document.addEventListener('click', (e)=>{\n    if(e.target.closest('#detail')) return;\n    const n = e.target.closest('.node, .actor');\n    if(n && n.dataset.id && DETAIL_IDS[n.dataset.id]){\n      if(selectedId === n.dataset.id) closeDetail(); else openDetail(n.dataset.id);\n    } else if(selectedId){\n      closeDetail();\n    }\n  });\n  window.addEventListener('resize', ()=>{ if(selectedId) openDetail(selectedId); });\n  document.getElementById('detailX').addEventListener('click', closeDetail);\n  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeDetail(); });\n\n  // Host protocol\n  window.addEventListener('message', (ev)=>{\n    const m = ev.data || {};\n    if(m.type === '__activate_edit_mode') twk.classList.add('open');\n    if(m.type === '__deactivate_edit_mode') twk.classList.remove('open');\n  });\n  try{ window.parent.postMessage({type:'__edit_mode_available'}, '*'); }catch(e){}\n\n  // Init\n  applyDark();\n  applyView();\n\n  // Re-layout after icons load\n  const allImgs = document.querySelectorAll('img');\n  let pending = allImgs.length;\n  if(pending===0) layout();\n  allImgs.forEach(img=>{\n    if(img.complete) { if(--pending<=0) layout(); }\n    else img.addEventListener('load', ()=>{ if(--pending<=0) layout(); }, {once:true});\n    img.addEventListener('error', ()=>{ if(--pending<=0) layout(); }, {once:true});\n  });\n  window.addEventListener('resize', ()=>{\n    clearTimeout(window.__lt); window.__lt = setTimeout(layout, 80);\n  });\n  setTimeout(layout, 250);\n  setTimeout(layout, 800);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
