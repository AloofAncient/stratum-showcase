  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Stratum — AWS Architecture<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>\n  :root{\n    --ink:#16191f; --ink-2:#3b4252; --muted:#5b6372;\n    --paper:#fafbfc; --paper-2:#f1f3f5; --card:#ffffff;\n    --line:#e5e7eb;\n\n    --c-cloud:#242F3E; --c-region:#00A4A6; --c-vpc:#8C4FFF;\n    --c-pub:#7AA116;   --c-priv:#00A4A6;\n    --c-acct:#E7157B;  --c-asg:#ED7100;\n    --c-phase1:#7e22ce; --c-phase2:#0369a1; --c-phase3:#0f766e; --c-cost:#b45309;\n\n    --arrow:#3b4252; --arrow-dim:#9aa0a6;\n    --hi:#ED7100;\n  }\n  html.dark{\n    --ink:#e5e7eb; --ink-2:#cbd5e1; --muted:#9aa3b2;\n    --paper:#0b1020; --paper-2:#0f172a; --card:#111827;\n    --line:#1f2937; --arrow:#cbd5e1; --arrow-dim:#64748b;\n  }\n  html.dark .stage::before{background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0)!important}\n  html.dark .grp{background-color:transparent !important}\n  html.dark .node .ic{background:#0f172a;box-shadow:0 1px 0 rgba(255,255,255,.04),0 6px 16px -10px rgba(0,0,0,.6)}\n  html.dark .actor .av{background:#0f172a;border-color:#334155;color:#cbd5e1}\n  html.dark .legend, html.dark .doc-head .pill{background:#0f172a;border-color:#1f2937;color:var(--ink-2)}\n  html.dark .grp-tag{background:#111827;color:var(--ink);box-shadow:0 0 0 1px #1f2937}\n  html.dark .anno{background:#111827;color:var(--ink-2);box-shadow:0 0 0 1px #1f2937}\n  html.dark .edges .lbl-bg{fill:#0b1020;stroke:#0b1020}\n  html.dark .edges text:not(.lbl-bg){fill:var(--ink-2)}\n  html.dark .stage{background:var(--card);border-color:var(--line)}\n\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);\n    font:13px/1.45 \"Inter\",\"Helvetica Neue\",ui-sans-serif,system-ui,-apple-system,sans-serif;\n    -webkit-font-smoothing:antialiased;font-feature-settings:\"ss01\",\"cv11\";\n    transition:background .25s, color .25s}\n\n  .page{min-height:100vh;padding:32px 40px 56px;max-width:1760px;margin:0 auto}\n  .doc-head{display:flex;align-items:flex-end;justify-content:space-between;\n    gap:32px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}\n  .doc-head .meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px}\n  .doc-head .pill{padding:3px 8px;border:1px solid var(--line);border-radius:999px;\n    background:var(--card);font-weight:500;letter-spacing:.02em}\n  .doc-head h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}\n  .doc-head .sub{color:var(--muted);font-size:12.5px;max-width:780px}\n  .doc-head .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}\n  .doc-head .crumbs{color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}\n\n  .stage{position:relative;background:var(--card);\n    border:1px solid var(--line);border-radius:12px;\n    box-shadow:0 1px 0 rgba(16,25,40,.02), 0 14px 40px -28px rgba(16,25,40,.18);\n    padding:30px 32px 36px;overflow:hidden;\n    transition:opacity .25s}\n  .stage::before{content:\"\";position:absolute;inset:0;pointer-events:none;\n    background-image:radial-gradient(circle at 1px 1px, rgba(16,25,40,.045) 1px, transparent 0);\n    background-size:22px 22px;opacity:.7}\n  .stage > *{position:relative}\n\n  /* Group containers */\n  .grp{position:relative;border-radius:10px;padding:34px 18px 18px}\n  .grp-cloud{border:1.5px solid var(--c-cloud)}\n  .grp-region{border:1.5px dashed var(--c-region);background:rgba(0,164,166,.025)}\n  .grp-vpc{border:1.5px solid var(--c-vpc);background:rgba(140,79,255,.04)}\n  .grp-pub{border:1.5px dashed var(--c-pub);background:rgba(122,161,22,.04)}\n  .grp-priv{border:1.5px dashed var(--c-priv);background:rgba(0,164,166,.05)}\n  .grp-phase1{border:1.5px solid var(--c-phase1);background:rgba(126,34,206,.03)}\n  .grp-phase2{border:1.5px solid var(--c-phase2);background:rgba(3,105,161,.03)}\n  .grp-acct{border:1.5px dashed var(--c-acct);background:rgba(231,21,123,.025)}\n\n  .grp-tag{position:absolute;top:8px;left:10px;display:flex;align-items:center;gap:6px;\n    font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);\n    background:var(--card);padding:2px 8px 2px 4px;border-radius:6px;\n    box-shadow:0 0 0 1px rgba(16,25,40,.06)}\n  .grp-tag .badge{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}\n  .grp-tag .badge.cloud{background:var(--c-cloud)}\n  .grp-tag .badge.region{background:var(--c-region)}\n  .grp-tag .badge.vpc{background:var(--c-vpc)}\n  .grp-tag .badge.pub{background:var(--c-pub)}\n  .grp-tag .badge.priv{background:var(--c-priv)}\n  .grp-tag .badge.phase1{background:var(--c-phase1)}\n  .grp-tag .badge.phase2{background:var(--c-phase2)}\n  .grp-tag .badge.phase3{background:var(--c-phase3)}\n  .grp-tag .badge.cost{background:var(--c-cost)}\n  .grp-tag .badge.acct{background:var(--c-acct)}\n  .grp-tag .meta{color:var(--muted);font-weight:400;letter-spacing:.02em;margin-left:2px}\n  .grp-tag .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;\n    background:var(--ink);color:var(--card);font-size:10px;font-weight:700}\n\n  /* Phase title pill in top-right of phase containers */\n  .phase-title{position:absolute;top:8px;right:10px;font-size:10.5px;\n    color:var(--muted);background:var(--card);padding:2px 8px;border-radius:6px;\n    box-shadow:0 0 0 1px rgba(16,25,40,.06)}\n\n  /* Inline flow-trace chip strip */\n  .flow-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n    margin:6px 0 14px;padding:6px 10px;\n    background:var(--card);border:1px solid var(--line);border-radius:10px}\n  .flow-chips-lbl{font-size:11px;font-weight:600;color:var(--muted);\n    text-transform:uppercase;letter-spacing:.06em;margin-right:4px}\n  .flow-chips .chip{font:inherit;font-size:12px;font-weight:500;\n    padding:5px 11px;border-radius:999px;border:1px solid var(--line);\n    background:var(--bg);color:var(--ink);cursor:pointer;\n    transition:all .12s ease}\n  .flow-chips .chip:hover{border-color:#bbb;background:#fff}\n  .flow-chips .chip.is-active{background:var(--hi);color:#fff;border-color:var(--hi);\n    box-shadow:0 1px 4px rgba(237,113,0,.25)}\n  .flow-chips .chip[data-flow=\"none\"].is-active{background:#475569;border-color:#475569}\n\n  /* Sub-group label inside private subnet (rows by flow) */\n  .subgrp-title{font-size:10.5px;font-weight:600;color:var(--muted);\n    text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px 2px}\n\n  /* Service node */\n  .node{display:flex;flex-direction:column;align-items:center;gap:6px;\n    width:90px;text-align:center;position:relative}\n  .node .ic{width:54px;height:54px;display:grid;place-items:center;\n    background:var(--card);border-radius:10px;\n    box-shadow:0 1px 0 rgba(16,25,40,.04), 0 6px 16px -10px rgba(16,25,40,.18);\n    transition:transform .15s, box-shadow .15s, outline .15s}\n  .node .ic img{width:46px;height:46px;display:block}\n  .node .lbl{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.25;text-wrap:balance}\n  .node .sub{font-size:10.25px;color:var(--muted);line-height:1.25;letter-spacing:.01em;text-wrap:balance}\n  .node .step{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;\n    background:var(--ink);color:var(--card);font-size:10.5px;font-weight:700;\n    display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}\n  .node.sm{width:78px}\n  .node.sm .ic{width:44px;height:44px;border-radius:8px}\n  .node.sm .ic img{width:36px;height:36px}\n  .node.sm .lbl{font-size:10.5px}\n\n  /* Highlight (journey) */\n  .highlight .node:not(.is-hi) .ic{opacity:.35}\n  .highlight .node:not(.is-hi) .lbl,\n  .highlight .node:not(.is-hi) .sub{opacity:.5}\n  .highlight .actor:not(.is-hi){opacity:.45}\n  .highlight .grp{opacity:.85}\n  .node.is-hi .ic{outline:2px solid var(--hi);outline-offset:3px}\n  .node.is-hi .step{background:var(--hi)}\n  .edges path.dim-out{opacity:.18}\n  .edges path.hi-edge{stroke:var(--hi)!important;stroke-width:2.2!important}\n  .edges path.hi-edge.dashed{stroke-dasharray:5 4}\n  /* Calm view: hide non-essential edges entirely (and their labels) */\n  .edges path.calm-hide,\n  .edges text.calm-hide{opacity:0;pointer-events:none}\n\n  /* Actor (user / admin / external) */\n  .actor{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}\n  .actor .av{width:54px;height:54px;border-radius:50%;background:var(--card);\n    border:1.5px solid #d6dae0;display:grid;place-items:center;color:var(--ink-2);\n    box-shadow:0 1px 0 rgba(16,25,40,.04), 0 6px 16px -10px rgba(16,25,40,.18)}\n  .actor.admin .av{border-color:var(--hi);color:var(--hi)}\n  .actor .lbl{font-size:11.5px;font-weight:600;color:var(--ink)}\n  .actor .sub{font-size:10.25px;color:var(--muted);text-wrap:balance;text-align:center}\n\n  /* Edges layer */\n  .edges{position:absolute;inset:0;pointer-events:none;overflow:visible}\n  .edges path{fill:none;stroke:var(--arrow);stroke-width:1.4;transition:opacity .2s, stroke .2s}\n  .edges path.dim{stroke:var(--arrow-dim);stroke-width:1.2}\n  .edges path.dashed{stroke-dasharray:4 4}\n  .edges path.thick{stroke-width:1.7}\n  .edges text{font:10.25px ui-sans-serif,system-ui,sans-serif;fill:var(--ink-2);\n    font-weight:500;letter-spacing:.01em}\n  .edges .lbl-bg{fill:var(--card);stroke:var(--card);stroke-width:6;paint-order:stroke}\n\n  /* Layout helpers */\n  .row{display:flex;gap:16px;align-items:stretch}\n  .col{display:flex;flex-direction:column;gap:14px}\n  .nodes-row{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap}\n  .nodes-row.tight{gap:20px}\n  .nodes-row.spread{justify-content:space-around}\n\n  /* Phase container — explicit framed area */\n  .phase{position:relative;padding:36px 22px 24px}\n  .phase + .phase{margin-top:18px}\n  .phase[data-phase=\"1\"]{border:1.5px solid var(--c-phase1);border-radius:12px;background:rgba(126,34,206,.025)}\n  .phase[data-phase=\"2\"]{border:1.5px solid var(--c-phase2);border-radius:12px;background:rgba(3,105,161,.025)}\n  .phase[data-phase=\"3\"]{border:1.5px solid var(--c-phase3);border-radius:12px;background:rgba(15,118,110,.03)}\n\n  /* Cost control band */\n  .costband{position:relative;margin-top:18px;padding:34px 20px 20px;\n    border:1.5px dashed var(--c-cost);border-radius:12px;background:rgba(180,83,9,.03)}\n\n  /* Hide-by-phase (generic — a phaseN view hides every other phase) */\n  .stage[data-show=\"phase1\"] .phase:not([data-phase=\"1\"]){display:none}\n  .stage[data-show=\"phase2\"] .phase:not([data-phase=\"2\"]){display:none}\n  .stage[data-show=\"phase3\"] .phase:not([data-phase=\"3\"]){display:none}\n\n  /* Legend */\n  .legend{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:18px;\n    padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}\n  .legend h4{margin:0 12px 0 0;font-size:11px;font-weight:600;letter-spacing:.06em;\n    text-transform:uppercase;color:var(--muted);align-self:center}\n  .legend .item{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2)}\n  .legend .swatch{width:22px;height:14px;border-radius:3px;background:var(--card)}\n  .legend .sw-cloud{border:1.5px solid var(--c-cloud)}\n  .legend .sw-vpc{border:1.5px solid var(--c-vpc)}\n  .legend .sw-pub{border:1.5px dashed var(--c-pub)}\n  .legend .sw-priv{border:1.5px dashed var(--c-priv)}\n  .legend .sw-p1{border:1.5px solid var(--c-phase1)}\n  .legend .sw-p2{border:1.5px solid var(--c-phase2)}\n  .legend .sw-p3{border:1.5px solid var(--c-phase3)}\n  .legend .sw-cost{border:1.5px dashed var(--c-cost)}\n  .legend .line{width:28px;height:0;border-top:1.4px solid var(--arrow)}\n  .legend .line.dashed{border-top-style:dashed}\n  .legend .line.hi{border-top-color:var(--hi);border-top-width:2px}\n\n  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;\n    color:var(--muted);font-size:11px;flex-wrap:wrap;gap:8px}\n\n  /* Tweaks (we hand-roll a small panel; toolbar protocol minimal) */\n  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:9999;width:260px;\n    background:var(--card);color:var(--ink);\n    border:1px solid var(--line);border-radius:12px;\n    box-shadow:0 14px 40px rgba(0,0,0,.18);\n    font:12px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;\n    display:none;overflow:hidden}\n  .twk-panel.open{display:block}\n  .twk-hd{display:flex;align-items:center;justify-content:space-between;\n    padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);user-select:none}\n  .twk-hd b{font-size:12.5px;font-weight:600;letter-spacing:.01em}\n  .twk-x{appearance:none;border:0;background:transparent;color:var(--muted);\n    width:24px;height:24px;border-radius:6px;font-size:14px;line-height:1;cursor:pointer}\n  .twk-x:hover{background:rgba(0,0,0,.06);color:var(--ink)}\n  .twk-body{padding:12px 14px;display:flex;flex-direction:column;gap:14px}\n  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n  .twk-row{display:flex;flex-direction:column;gap:6px}\n  .twk-seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n  .twk-seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink-2);\n    padding:6px 8px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}\n  .twk-seg button:last-child{border-right:0}\n  .twk-seg button.on{background:var(--ink);color:var(--card)}\n  .twk-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px}\n  .twk-toggle .sw{width:32px;height:18px;background:#cbd5e1;border-radius:999px;position:relative;cursor:pointer;transition:background .15s}\n  .twk-toggle .sw::after{content:\"\";position:absolute;left:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .15s}\n  .twk-toggle.on .sw{background:#0ea5e9}\n  .twk-toggle.on .sw::after{left:16px}\n\n  .twk-open{position:fixed;right:16px;bottom:16px;z-index:9998;appearance:none;cursor:pointer;\n    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);\n    font:600 12px/1 ui-sans-serif,system-ui,-apple-system,sans-serif;padding:10px 16px;\n    box-shadow:0 6px 24px rgba(0,0,0,.18)}\n  .node .ic,.actor .av{position:relative}\n  .has-detail{cursor:pointer}\n  .has-detail .ic::after,.has-detail .av::after{content:\"i\";position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;\n    background:var(--hi);color:#fff;font:italic 700 10px/15px Georgia,serif;text-align:center;box-shadow:0 0 0 2px var(--card)}\n  .is-selected .ic,.is-selected .av{outline:2px solid var(--hi);outline-offset:3px}\n  .detail{position:absolute;left:0;top:0;z-index:9999;width:300px;max-height:calc(100vh - 24px);overflow:auto;\n    background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;\n    box-shadow:0 14px 40px rgba(0,0,0,.2);padding:16px 18px 18px;display:none;\n    font:12.5px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}\n  .detail.open{display:block}\n  .detail-x{position:absolute;top:8px;right:8px;appearance:none;border:0;background:transparent;color:var(--muted);\n    width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1;cursor:pointer}\n  .detail-x:hover{background:rgba(0,0,0,.06);color:var(--ink)}\n  .detail-kicker{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--hi);margin-bottom:4px}\n  .detail h3{margin:0 24px 8px 0;font-size:16px;font-weight:600;letter-spacing:-.01em}\n  .detail p{margin:0 0 10px;color:var(--ink-2)}\n  .detail ul{margin:0 0 12px;padding-left:18px;color:var(--ink-2)}\n  .detail li{margin-bottom:4px}\n  .detail-sub{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}\n  .detail-links{display:flex;flex-direction:column;gap:4px}\n  .detail-links div{display:flex;gap:8px;color:var(--ink-2)}\n  .detail-links b{font-weight:600;color:var(--hi);width:14px;flex:0 0 14px}\n  .twk-open:hover{border-color:var(--hi);color:var(--hi)}\n  .twk-panel.open ~ .twk-open{display:none}\n  .node,.actor{cursor:default}\n  .edges path.hover-off,.edges text.hover-off{opacity:.1!important}\n  .edges path.hover-on{stroke:var(--hi)!important;stroke-width:2.2!important;opacity:1!important}\n  @media print{\n    .twk-open,.detail{display:none}\n    body{background:#fff}\n    .stage{box-shadow:none;border-color:#cfd4da}\n    .twk-panel{display:none!important}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"page\">\n\n  <!-- Header -->\n  <header class=\"doc-head\">\n    <div>\n      <div class=\"crumbs\">Stratum &nbsp;·&nbsp; AWS architecture<\u002Fdiv>\n      <h1>Stratum — medallion data pipeline, FastAPI gateway and AI layer<\u002Fh1>\n      <div class=\"sub\">Phase 1: weekly Step Functions pipeline (raw → bronze → silver → gold). Phase 2: FastAPI gateway on ECS Fargate Spot behind CloudFront, Google SSO via Cognito with two roles, deny by default. Phase 3: AI layer — Amplify ops UI, Ops Chat and a human-gated change pipeline on Amazon Bedrock, plus a billing circuit breaker for cost control.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"right\">\n      <div class=\"meta\">\n        <span class=\"pill\">Region · us-east-1<\u002Fspan>\n        <span class=\"pill\">Terraform<\u002Fspan>\n        <span class=\"pill\">DEV<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- Diagram -->\n  <div class=\"stage\" id=\"stage\" data-show=\"both\">\n\n    <!-- ─── PHASE 1: Data pipeline ─────────────────────────────────── -->\n    <section class=\"phase\" data-phase=\"1\">\n      <span class=\"grp-tag\"><span class=\"badge phase1\">①<\u002Fspan> Phase 1 <span class=\"meta\">· Weekly data pipeline<\u002Fspan><\u002Fspan>\n      <span class=\"phase-title\">Step Functions · Glue medallion · DynamoDB tracking<\u002Fspan>\n\n      <div class=\"row\" style=\"gap:22px;align-items:flex-start\">\n\n        <!-- Col A: trigger + orchestrator -->\n        <div class=\"col\" style=\"gap:32px;flex:0 0 130px;align-items:center;padding-top:20px\">\n          <div class=\"node\" data-id=\"scheduler\">\n            <div class=\"ic\"><img src=\"16a28b65-5d2d-4d9b-8442-b6c4ff168122\" alt=\"\"><\u002Fdiv>\n            <div class=\"lbl\">EventBridge<\u002Fdiv>\n            <div class=\"sub\">Weekly cron<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"node\" data-id=\"sfn\">\n            <div class=\"ic\" style=\"width:64px;height:64px\"><img src=\"c85d4327-5299-416b-8bcb-e103fb2084d0\" alt=\"\" style=\"width:54px;height:54px\"><\u002Fdiv>\n            <div class=\"lbl\">Step Functions<\u002Fdiv>\n            <div class=\"sub\">stratum-pipeline<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"actor\" data-id=\"yahoo\">\n            <div class=\"av\">\n              <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n                <circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"lbl\">Yahoo Finance<\u002Fdiv>\n            <div class=\"sub\">Public API<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Col B: vertical step-by-step compute -->\n        <div class=\"grp grp-priv\" style=\"flex:0 0 220px;padding:34px 14px 18px\">\n          <span class=\"grp-tag\"><span class=\"badge priv\">⇣<\u002Fspan> Steps<\u002Fspan>\n          <div class=\"col\" style=\"gap:18px;align-items:center\">\n            <div class=\"node\" data-id=\"tracker\">\n              <div class=\"step\">1<\u002Fdiv>\n              <div class=\"ic\"><img src=\"ae95e3d4-8b9e-45c1-865a-b2e2d1b8a7f1\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">pipeline-tracker<\u002Fdiv>\n              <div class=\"sub\">start / complete<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"notifier\">\n              <div class=\"step\">2<\u002Fdiv>\n              <div class=\"ic\"><img src=\"ae95e3d4-8b9e-45c1-865a-b2e2d1b8a7f1\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">pipeline-notifier<\u002Fdiv>\n              <div class=\"sub\">started / final<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"ingestor\">\n              <div class=\"step\">3<\u002Fdiv>\n              <div class=\"ic\"><img src=\"ae95e3d4-8b9e-45c1-865a-b2e2d1b8a7f1\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">data-ingestor<\u002Fdiv>\n              <div class=\"sub\">Yahoo → raw<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"glueRB\">\n              <div class=\"step\">4<\u002Fdiv>\n              <div class=\"ic\"><img src=\"77b9c05e-c524-4d15-95e8-b623a56d347f\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">raw → bronze<\u002Fdiv>\n              <div class=\"sub\">Glue ETL<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"glueBS\">\n              <div class=\"step\">5<\u002Fdiv>\n              <div class=\"ic\"><img src=\"77b9c05e-c524-4d15-95e8-b623a56d347f\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">bronze → silver<\u002Fdiv>\n              <div class=\"sub\">Glue ETL<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"glueSG\">\n              <div class=\"step\">6<\u002Fdiv>\n              <div class=\"ic\"><img src=\"77b9c05e-c524-4d15-95e8-b623a56d347f\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">silver → gold<\u002Fdiv>\n              <div class=\"sub\">Glue ETL<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Col C: per-step targets, vertically aligned to their step -->\n        <div class=\"col\" style=\"flex:1;gap:18px;align-items:flex-start;padding-top:34px\">\n          <div class=\"node\" data-id=\"ddbExec\">\n            <div class=\"ic\"><img src=\"fc29d559-18fd-4bc2-b985-f1a92a196d25\" alt=\"\"><\u002Fdiv>\n            <div class=\"lbl\">pipeline-executions<\u002Fdiv>\n            <div class=\"sub\">DynamoDB<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"node\" data-id=\"snsPipe\">\n            <div class=\"ic\"><img src=\"3ea2ce39-858f-4dc0-a3cb-8cc6901e6fae\" alt=\"\"><\u002Fdiv>\n            <div class=\"lbl\">pipeline-notifications<\u002Fdiv>\n            <div class=\"sub\">SNS topic<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"actor admin\" data-id=\"ownerEmail\" style=\"margin-left:8px\">\n            <div class=\"av\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n                <path d=\"M3 7l9 6 9-6\"><\u002Fpath><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"lbl\">Owner email<\u002Fdiv>\n            <div class=\"sub\">Pipeline alerts<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"node\" data-id=\"s3raw\"><div class=\"ic\"><img src=\"bd61c49e-4b78-4e5e-8e44-ae7e81fd4bc6\" alt=\"\"><\u002Fdiv><div class=\"lbl\">S3 raw<\u002Fdiv><div class=\"sub\">stratum-dev-raw<\u002Fdiv><\u002Fdiv>\n          <div class=\"node\" data-id=\"s3bronze\"><div class=\"ic\"><img src=\"bd61c49e-4b78-4e5e-8e44-ae7e81fd4bc6\" alt=\"\"><\u002Fdiv><div class=\"lbl\">S3 bronze<\u002Fdiv><\u002Fdiv>\n          <div class=\"node\" data-id=\"s3silver\"><div class=\"ic\"><img src=\"bd61c49e-4b78-4e5e-8e44-ae7e81fd4bc6\" alt=\"\"><\u002Fdiv><div class=\"lbl\">S3 silver<\u002Fdiv><\u002Fdiv>\n          <div class=\"node\" data-id=\"s3gold\"><div class=\"ic\"><img src=\"bd61c49e-4b78-4e5e-8e44-ae7e81fd4bc6\" alt=\"\"><\u002Fdiv><div class=\"lbl\">S3 gold<\u002Fdiv><div class=\"sub\">weekly metrics<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- (Owner email moved into Col C, next to SNS, to shorten the connector) -->\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <!-- ─── PHASE 2: Gateway API ───────────────────────────────────── -->\n    <section class=\"phase\" data-phase=\"2\">\n      <span class=\"grp-tag\"><span class=\"badge phase2\">②<\u002Fspan> Phase 2 <span class=\"meta\">· Gateway API · app.stratum-gateway-aws-dev.click<\u002Fspan><\u002Fspan>\n      <span class=\"phase-title\">CloudFront → FastAPI on Fargate Spot · Cognito SSO · two roles<\u002Fspan>\n\n      <!-- Flow trace chips: click to highlight only that flow's edges -->\n      <div class=\"flow-chips\" id=\"flowChips\" role=\"tablist\" aria-label=\"Trace a flow\">\n        <span class=\"flow-chips-lbl\">Trace flow:<\u002Fspan>\n        <button class=\"chip is-active\" data-flow=\"none\">Calm view<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"dataFetch\">Data fetch<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"cognitoAuth\">Cognito SSO<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"accessFlow\">Access request<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"all\">Show all<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"row\" style=\"gap:18px;align-items:stretch\">\n\n        <!-- Left: users + edge -->\n        <div class=\"col\" style=\"flex:0 0 150px;gap:18px;align-items:center;justify-content:space-around\">\n          <div class=\"actor\" data-id=\"user\">\n            <div class=\"av\">\n              <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n                <circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"lbl\">End user<\u002Fdiv>\n            <div class=\"sub\">Browser · Google sign-in<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"node\" data-id=\"cf\">\n            <div class=\"ic\"><img src=\"2d187c6d-bb96-4231-ab08-0b865ba739a7\" alt=\"\"><\u002Fdiv>\n            <div class=\"lbl\">CloudFront<\u002Fdiv>\n            <div class=\"sub\">CDN · TLS · forwards Authorization<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"node\" data-id=\"route53\">\n            <div class=\"ic\"><img src=\"ece5b48c-ac52-4242-ba47-51043d6f3640\" alt=\"\"><\u002Fdiv>\n            <div class=\"lbl\">Route 53<\u002Fdiv>\n            <div class=\"sub\">origin A record · task public IP<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Center: VPC (public subnet only, no NAT) -->\n        <div class=\"grp grp-vpc\" style=\"flex:0 0 250px;display:flex;flex-direction:column;justify-content:center\">\n          <span class=\"grp-tag\"><span class=\"badge vpc\">⬡<\u002Fspan> VPC <span class=\"meta\">· public subnets, no NAT<\u002Fspan><\u002Fspan>\n          <div class=\"grp grp-pub\" style=\"padding:30px 12px 14px\">\n            <span class=\"grp-tag\"><span class=\"badge pub\">⇡<\u002Fspan> Public subnet<\u002Fspan>\n            <div class=\"nodes-row tight\" style=\"justify-content:center;gap:10px\">\n              <div class=\"node\" data-id=\"fargate\">\n                <div class=\"ic\"><img src=\"e0de7839-87e4-4d38-af0e-f003ca107b4d\" alt=\"\"><\u002Fdiv>\n                <div class=\"lbl\">Gateway API<\u002Fdiv>\n                <div class=\"sub\">FastAPI · Fargate Spot · public IP<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"node sm\" data-id=\"ecs\">\n                <div class=\"ic\"><img src=\"eb8b200a-f5be-4f5f-a45a-fd9d6cb75901\" alt=\"\"><\u002Fdiv>\n                <div class=\"lbl\">ECS service<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Middle: AWS services the gateway reaches with its task role (one column so every edge has a clear path) -->\n        <div class=\"grp grp-priv\" style=\"flex:0 0 300px;padding:30px 14px 14px\">\n          <span class=\"grp-tag\"><span class=\"badge priv\">⇣<\u002Fspan> AWS services <span class=\"meta\">· task IAM role<\u002Fspan><\u002Fspan>\n          <div class=\"col\" style=\"gap:14px;align-items:flex-start\">\n            <div class=\"subgrp-title\">Data fetch<\u002Fdiv>\n            <div class=\"node\" data-id=\"s3goldRef\">\n              <div class=\"ic\"><img src=\"bd61c49e-4b78-4e5e-8e44-ae7e81fd4bc6\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">S3 — gold<\u002Fdiv>\n              <div class=\"sub\">weekly metrics read<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"ddbExecRef\">\n              <div class=\"ic\"><img src=\"fc29d559-18fd-4bc2-b985-f1a92a196d25\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">pipeline-executions<\u002Fdiv>\n              <div class=\"sub\">execution records<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"sfnRef\">\n              <div class=\"ic\"><img src=\"c85d4327-5299-416b-8bcb-e103fb2084d0\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">Step Functions<\u002Fdiv>\n              <div class=\"sub\">admin-only on-demand trigger<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"subgrp-title\" style=\"margin-top:6px\">Access &amp; identity<\u002Fdiv>\n            <div class=\"node\" data-id=\"ddbReq\">\n              <div class=\"ic\"><img src=\"fc29d559-18fd-4bc2-b985-f1a92a196d25\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">access-requests<\u002Fdiv>\n              <div class=\"sub\">pending · approved · rejected<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"snsAccess\">\n              <div class=\"ic\"><img src=\"3ea2ce39-858f-4dc0-a3cb-8cc6901e6fae\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">access-requests<\u002Fdiv>\n              <div class=\"sub\">SNS topic<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"cognito\">\n              <div class=\"ic\"><img src=\"be62f4f7-8a24-4066-9394-ef9eb94b3264\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">Cognito<\u002Fdiv>\n              <div class=\"sub\">Google SSO · stratum-user / stratum-admin<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"node\" data-id=\"ses\">\n              <div class=\"ic\"><img src=\"eff56e6e-278c-5383-8c1d-78d0fe1a0260\" alt=\"\"><\u002Fdiv>\n              <div class=\"lbl\">SES<\u002Fdiv>\n              <div class=\"sub\">approval / rejection email<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Right: people at the end of the access flow -->\n        <div class=\"col\" style=\"flex:1;gap:14px;align-items:center;justify-content:flex-end\">\n          <div class=\"actor admin\" data-id=\"adminEmail\">\n            <div class=\"av\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n                <path d=\"M3 7l9 6 9-6\"><\u002Fpath><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"lbl\">Admin<\u002Fdiv>\n            <div class=\"sub\">Approves / rejects in the ops UI<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"actor\" data-id=\"reqEmail\">\n            <div class=\"av\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n                <path d=\"M3 7l9 6 9-6\"><\u002Fpath><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"lbl\">Requester<\u002Fdiv>\n            <div class=\"sub\">Gets the decision email<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ─── PHASE 3: AI layer + change pipeline ────────────────────── -->\n    <section class=\"phase\" data-phase=\"3\">\n      <span class=\"grp-tag\"><span class=\"badge phase3\">③<\u002Fspan> Phase 3 <span class=\"meta\">· AI layer · ui.stratum-gateway-aws-dev.click<\u002Fspan><\u002Fspan>\n      <span class=\"phase-title\">Ops UI (Amplify) · Amazon Bedrock · Aurora DSQL · human-gated change pipeline<\u002Fspan>\n\n      <div class=\"flow-chips\" id=\"flowChips3\" role=\"tablist\" aria-label=\"Trace a flow\">\n        <span class=\"flow-chips-lbl\">Trace flow:<\u002Fspan>\n        <button class=\"chip is-active\" data-flow=\"none\">Calm view<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"chatFlow\">Ops Chat<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"changeFlow\">Change pipeline<\u002Fbutton>\n        <button class=\"chip\" data-flow=\"all\">Show all<\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- 3a: Ops UI → gateway → Bedrock / DSQL / read-only tools -->\n      <div class=\"subgrp-title\" style=\"margin-top:4px\">Ops Chat · usage and cost recorded for every model call<\u002Fdiv>\n      <div class=\"row\" style=\"gap:18px;align-items:stretch\">\n\n        <div class=\"col\" style=\"flex:0 0 130px;align-items:center;justify-content:center\">\n          <div class=\"actor\" data-id=\"opsUser\">\n            <div class=\"av\">\n              <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\n                <circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"lbl\">Ops user<\u002Fdiv>\n            <div class=\"sub\">stratum-user · stratum-admin<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"col\" style=\"flex
